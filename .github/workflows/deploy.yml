name: Deploy
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Test Image
        run: docker build -t vikas9dev/react-test -f ./client/Dockerfile.dev ./client
      - name: Run Tests
        run: docker run -e CI=true vikas9dev/react-test npm test -- --coverage
      - name: Build Production Images
        run: |
          docker build -t vikas9dev/computehub-client ./client
          docker build -t vikas9dev/computehub-nginx ./nginx
          docker build -t vikas9dev/computehub-server ./server
          docker build -t vikas9dev/computehub-worker ./worker
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Push Images to Docker Hub
        run: |
          docker push vikas9dev/computehub-client
          docker push vikas9dev/computehub-nginx
          docker push vikas9dev/computehub-server
          docker push vikas9dev/computehub-worker