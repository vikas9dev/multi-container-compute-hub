name: Deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - '.github/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Test Image
        run: docker build -t vikas9dev/react-test -f ./client/Dockerfile.dev ./client
      - name: Run Tests
        run: docker run -e CI=true vikas9dev/react-test npm test -- --coverage

  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Production Images
        run: |
          docker build -t vikas9dev/computehub-client ./client
          docker build -t vikas9dev/computehub-nginx ./nginx
          docker build -t vikas9dev/computehub-server ./server
          docker build -t vikas9dev/computehub-worker ./worker
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      
      - name: Push Images to Docker Hub
        run: |
          docker push vikas9dev/computehub-client
          docker push vikas9dev/computehub-nginx
          docker push vikas9dev/computehub-server
          docker push vikas9dev/computehub-worker

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: multi-container-compute-hub
          environment_name: Multi-container-compute-hub-env
          version_label: ${{ github.sha }}
          region: us-east-1
          deployment_package: docker-compose.yml

      - name: Update Docker Hub Description (Client)
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: vikas9dev/computehub-client
          short-description: "Frontend Client for ComputeHub"
          readme-filepath: ./README.md

      - name: Update Docker Hub Description (Nginx)
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: vikas9dev/computehub-nginx
          short-description: "Routing Nginx for ComputeHub"
          readme-filepath: ./README.md

      - name: Update Docker Hub Description (Server)
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: vikas9dev/computehub-server
          short-description: "Backend API Server for ComputeHub"
          readme-filepath: ./README.md

      - name: Update Docker Hub Description (Worker)
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: vikas9dev/computehub-worker
          short-description: "Worker Service for ComputeHub"
          readme-filepath: ./README.md